review_guidelines = """
docbank is a single-user personal document archive: a local daemon owns
the vault (SQLite + content-addressed blobs) and the CLI, agents, and a
static web UI are HTTP clients of its loopback API. Not designed for
multi-user, multi-tenant, or internet-facing deployment.

Key assumptions reviewers MUST account for:

1. REVIEW THE IMMUTABLE TARGET AND REUSE ACTUAL EVIDENCE. Read committed
   review ranges with `git show`, `git diff`, or an archive at the exact
   target HEAD. Reuse recorded commit, command, result, and failure evidence;
   never assume or claim a package or full suite ran. Run an additional
   focused test only for a named unresolved risk, in an isolated checkout at
   the exact target HEAD, and remove that checkout afterward. Never probe,
   mutate, or test the live implementation worktree, index, or branch. Do not
   repeat package or full suites without a named unresolved risk.

2. COMPILATION BELONGS TO THE COMPILER. Review agents must not assess
   compilability or raise compilation findings. Syntax validity, type checking,
   import resolution, and symbol availability belong to compiler and CI checks.
   Do not infer build failures from unfamiliar code or remembered language and
   standard-library versions, and do not run builds to act as a compilation
   reviewer. Review behavior, contracts, and logic instead. Implementing agents
   still run the required build and test checks and fix actual tool failures.

3. BUILD TAGS: supported Go builds and tests use `-tags fts5` in both CGO
   mode (mattn SQLite) and `CGO_ENABLED=0` mode (modernc SQLite). A failure
   of an untagged `go build` or `go test` is not a finding.

4. AUTH MODEL: the daemon always enforces an API key. An empty
   configured `api_key` means the daemon generates an ephemeral per-run
   key at startup and publishes it through the runtime record inside
   the owner-private $DOCBANK_HOME (0700 on Unix, a restricted DACL on
   Windows) — readable only by the vault owner, exactly
   like the shutdown token. Keyless config is therefore NOT
   unauthenticated. Binds are loopback-only by validation; the API is
   plain HTTP by design and remote access is documented as SSH
   tunnel/VPN. Do not flag missing TLS, missing rate limiting, or
   multi-tenant concerns. DO flag any path that would serve without an
   effective key or accept a non-loopback bind.

5. DAEMON COMPATIBILITY: data commands accept only a daemon runtime
   record carrying this binary's protocol revision and an effective API
   key, even when its version string matches. Missing or mismatched
   protocol metadata forces stop-and-replace before any data request;
   discovery for status/stop remains permissive so an incompatible daemon
   can still be found and shut down.

6. CONCURRENCY MODEL: one daemon holds the portable vault file lock exclusively for
   its lifetime; gc/verify/trash-empty serialize against mutations via
   the in-process maintenance gate, not the file lock. Id-addressed
   mutations require If-Match revisions; path mutations
   (POST /path/move, /path/trash) intentionally take no If-Match
   because they resolve and mutate inside one store transaction.

7. PLATFORM: Linux, macOS, and Windows are supported. The complete CLI,
   daemon, vault/tree lock, backup, and restore suites run on Windows amd64
   and arm64. Unix uses flock identities; Windows uses LockFileEx plus
   volume/file identities and rejects final reparse points. Do not reintroduce
   compile-only Windows lifecycle stubs.

8. LOCAL FILE TRUST: files under $DOCBANK_HOME are user-owned in an
   owner-private directory (0700 or a restricted DACL). An attacker with access to them already has the
   user's privileges; do not flag TOCTOU or permission races on
   vault-local paths. Restore targets and their parent paths have the same
   local-user trust boundary. Restore holds descriptor-confined roots so a
   pathname replacement cannot redirect writes, while hierarchy locks
   coordinate cooperating Docbank processes with stable root paths. Do not
   require those advisory locks to withstand a same-UID process arbitrarily
   reparenting a leased directory into another live vault: that requires write
   authority to the destination vault and already permits direct corruption.
   POST /ingest reads server-side local paths and
   is loopback-fenced per request by design. Reaching that loopback
   listener remotely (the documented SSH tunnel) requires an SSH
   account on the daemon host, which already grants filesystem access
   exceeding anything ingest exposes — do not flag tunneled loopback
   as an ingest capability bypass; there is no principal with the API
   key and tunnel access but without shell.

9. SINGLE-USER SCALE: do not flag O(n) scans, in-memory pagination, or
   missing batching at personal-archive scale unless the code path is
   plausibly hot at tens of thousands of nodes.

10. RELEASE SIGNING IS DEFERRED, ON RECORD: `docbank update` accepts
   unsigned SHA256 checksums (`AllowUnsignedChecksums: true`) as a
   deliberate decision — the only party who could tamper with release
   assets can compromise the repository, and a CI-held signing key
   would sign whatever that attacker releases. Ed25519 signing with an
   offline/protected key is tracked (kata issue "Sign releases for
   docbank update") for before the repo goes public. Do not re-flag
   unsigned release checksums; DO flag any weakening beyond this
   (e.g. skipping checksum verification itself).

11. INSTALLER BOOTSTRAP ORIGIN IS DELIBERATE: the documented install
   commands fetch scripts/install.sh and scripts/install.ps1 from
   docbank.ai, which serves the repository copies verbatim (the docs
   build copies them into the site root). Every curl|sh bootstrap
   trusts its origin equally — a GitHub raw URL would swap the single
   point of failure, not remove it — and the installers verify each
   archive against its GitHub release's SHA256SUMS before installing,
   so a compromised site cannot silently substitute binaries, only the
   bootstrap itself. setup.md documents the raw.githubusercontent
   command for readers who want a trust origin independent of the
   site's hosting. Do not re-flag docbank.ai-served install commands
   as a trust-boundary regression; DO flag installer changes that skip
   archive verification or make the served copy diverge from
   scripts/.

12. DOCS FOLLOW THE RELEASE BOUNDARY: user-facing sources on main describe
   every merged capability directly in present tense, including homepage and
   install-adjacent copy. The public Zensical site is not deployed until the
   corresponding binary release is tagged, so do not demand "next release",
   source-build-only, or newest-tag qualifiers for merged capabilities.
   Release preparation must ensure capability documentation matches the binary
   being tagged. After the tag and GitHub release exist, the finalized release
   notes and date are intentionally added to docs/changelog.md in a docs-only
   follow-up PR, and the website is deployed from the resulting main commit.
   That changelog commit is necessarily absent from the preceding software tag;
   DO NOT report that absence or demand another release tag. DO flag a
   post-release docs change that advertises behavior absent from the released
   binary, or a pre-release deployment that exposes unreleased behavior.

13. EXTERNAL STORE CONFIDENTIALITY IS A DOCUMENTED DEPLOYMENT BOUNDARY:
   filesystem and S3 secondary objects preserve Kit's physical encoding and
   are not client-side encrypted by Docbank. Raw namespace readers are
   explicitly inside the storage trust boundary; users must restrict access
   and may use independently controlled filesystem, bucket, or KMS encryption.
   Native live-store encryption is deliberately deferred in docs/roadmap.md.
   Do not re-flag the absence of client-side encryption as an API-key bypass:
   the API key protects daemon access, not direct access to operator-configured
   physical storage. DO flag documentation claiming those objects are
   encrypted, any path that exposes storage credentials, or any weakening of
   configured storage transport or authentication.

14. STACKED WORK LANDS UNWIRED ON PURPOSE: a PR that declares itself part
   of a stack (for example "Part of #176. Stacks on #189.") adds the
   capability first and the caller in a later branch. New exported API with
   no production caller is therefore the plan, not a gap, and an existing
   flow that still uses the older path is the state that later branch will
   change. Do not report "not wired into production", "no production
   callers", or "the old flow is still used" as a security finding against
   such a PR; the safeguard cannot protect a caller that this branch does
   not claim to add. DO flag a caller this branch does add that bypasses
   the new path, and DO flag an unwired API whose own contract is wrong.

15. STATIC CONTENT SCANNING IS BEST-EFFORT: the document inspector screens
   markup, stylesheets, and PDF structure for references that leave the
   document. It reduces exposure and is deliberately not a complete
   sanitizer: scripted, entity-split, and consumer-specific references stay
   out of reach, and the enforceable boundary is the rendition provider
   contract plus the sealed capability record. Report a missed reference
   class once, with the concrete path a consumer would dereference. Do not
   re-file each newly imagined attribute, element, or filename spelling as
   a separate finding, and do not treat the absence of an exhaustive
   allowlist as a vulnerability. DO flag a change that stops classifying a
   reference form the inspector already covered.

16. REUSE AUTHORITATIVE TEST EVIDENCE: review the exact immutable commit range
   in an isolated checkout and read its existing authority report before asking
   for more tests. Reuse recorded passing evidence for unchanged scopes. Request
   only exact covering tests for changed production code or a concrete unresolved
   risk; do not request full-package or full-suite reruns merely because review
   executes separately.

17. BACKUP CONTENT IS OUTSIDE THE SECURITY BOUNDARY: backup and restore are
   portability mechanisms for vault-owner-controlled data, not hostile archive
   ingestion. Restored graph state must still satisfy schema, shape, bounds, and
   reference integrity, but receipts are historical records rather than a ledger
   that reconstructs current asset state. Do not require contiguous receipt
   history, automatic revision-1 baselines, or terminal-state agreement with
   receipts. DO flag malformed records that bypass structural validation or
   invalid graph references that could corrupt current state.

Do NOT flag issues that only apply to public-facing, multi-tenant, or
internet-exposed services. Focus on bugs, logic errors, data corruption
risks, and code quality issues.
"""
