[project]
site_name = "docbank"
site_url = "https://docbank.ai/docs/"
site_description = "Keep, find, update, and recover documents in a vault you control."
site_author = "Kenn Software LLC"
copyright = 'Copyright &copy; 2026 <a href="https://kenn.io">Kenn Software LLC</a>.'
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/kenn-io/docbank"
repo_name = "kenn-io/docbank"
extra_css = ["stylesheets/extra.css"]
use_directory_urls = true
nav = [
  {"Overview" = "index.md"},
  {"Changelog" = "changelog.md"},
  {"Start here" = [
    {"Setup" = "setup.md"},
    {"Quickstart" = "quickstart.md"},
    {"Capabilities" = "capabilities.md"},
    {"Visual tour" = "tour.md"},
  ]},
  {"Work with documents" = [
    {"Importing documents" = "usage/importing.md"},
    {"Photo assets" = "usage/photos.md"},
    {"People" = "usage/people.md"},
    {"Email PDFs" = "usage/email-pdf.md"},
    {"Organizing and tagging" = "usage/organizing.md"},
    {"Searching" = "usage/searching.md"},
    {"Search exports" = "usage/search-exports.md"},
    {"Document processing" = "usage/document-processing.md"},
    {"Document processing search" = "usage/search.md"},
    {"Web application" = "usage/web.md"},
    {"Interactive terminal browser" = "usage/tui.md"},
  ]},
  {"Protect and operate" = [
    {"Vault lifecycle" = "usage/lifecycle.md"},
    {"Run in a container" = "usage/containers.md"},
    {"Permanent audited history" = "usage/audited-history.md"},
    {"Trash, garbage collection, repack, and verify" = "usage/trash-and-gc.md"},
    {"Multi-store storage" = "usage/storage.md"},
    {"Backup and restore" = "usage/backup.md"},
    {"Verify transfer packages" = "usage/transfers.md"},
    {"Verified export bundles" = "usage/export-bundles.md"},
    {"Troubleshooting" = "troubleshooting.md"},
  ]},
  {"Automate and integrate" = [
    {"Docbank for agents" = "agents.md"},
    {"Agent integration guide" = "agents/integration.md"},
    {"Model Context Protocol" = "usage/mcp.md"},
    {"Embed in Go" = "embedding.md"},
    {"Document understanding in Go" = "document-understanding.md"},
  ]},
  {"Reference" = [
    {"CLI reference" = "cli-reference.md"},
    {"Configuration" = "configuration.md"},
    {"Document processing configuration" = "usage/configuration.md"},
    {"HTTP API" = "architecture/http-api.md"},
  ]},
  {"How it works" = [
    {"How Docbank works" = "architecture/overview.md"},
    {"Document processing" = "architecture/document-processing.md"},
    {"Source metadata" = "architecture/source-metadata.md"},
    {"Format coverage" = "architecture/format-coverage.md"},
    {"Document timeline" = "architecture/document-timeline.md"},
    {"Visual previews" = "architecture/visual-previews.md"},
    {"Verified page images" = "architecture/page-images.md"},
    {"Storage" = "architecture/storage.md"},
    {"Loose and packed content" = "architecture/packed-storage.md"},
    {"Editing and versions" = "architecture/editing-and-versions.md"},
    {"Ownership and concurrency" = "architecture/locking.md"},
    {"Daemon and process model" = "architecture/daemon.md"},
    {"Backup and recovery" = "architecture/backup.md"},
    {"Integrity and trust" = "architecture/integrity.md"},
    {"Audited history" = "architecture/audited-history.md"},
    {"Document derivatives" = "architecture/document-derivatives.md"},
  ]},
  {"Project" = [
    {"Roadmap" = "roadmap.md"},
    {"License" = "license.md"},
  ]},
]

[project.extra]
homepage = "/"

[project.theme]
variant = "modern"
custom_dir = "overrides"
font = false
features = [
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.sections",
  "navigation.path",
  "content.code.copy",
]

[project.theme.palette]
scheme = "slate"
primary = "custom"
accent = "custom"

[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "lucide/pencil"
view = "lucide/file-code"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true
