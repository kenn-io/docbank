name: Recording search qualification
on:
  push:
    branches: [feat/recording-semantic-search]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recording-search-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cgo: ['1', '0']
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      GOFLAGS: -trimpath
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Focused production retrieval contracts
        run: go test -tags fts5 ./internal/retrieval ./internal/store ./internal/processing ./internal/api ./internal/config ./docbank ./cmd/docbank ./internal/daemonconn -run 'TestSelectedMedia|TestMediaSearch|FuzzSelectedMedia' -count=1 -timeout=15m

      - name: Selected build fusion property
        run: go test -tags fts5 ./internal/retrieval -run '^$' -fuzz FuzzSelectedMediaFusionKeepsBuildIdentity -fuzztime=5s -parallel=2
      - name: Formatting and vet
        run: |
          make fmt
          git diff --exit-code -- '*.go'
          go vet -tags fts5 ./internal/retrieval ./internal/store ./internal/processing ./internal/api
  generated:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3
      - run: kit-retry 3 5 npm ci --prefix frontend
      - run: make generate-api
      - run: npm --prefix frontend run fmt
      - run: npm --prefix frontend run check
      - run: npm --prefix frontend test -- src/generated-requests.test.ts src/receipts.test.ts
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: recording-api-generated
          retention-days: 3
          path: |
            internal/api/openapi.yaml
            internal/apiclient/client.gen.go
            frontend/src/generated/docbank.ts
            frontend/orval.config.ts
            frontend/src/generated-requests.test.ts
            frontend/src/receipts.test.ts
