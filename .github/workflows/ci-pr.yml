name: CI

# PR and merge-group candidates run ci.yml@main on GitHub-hosted runners; ci.yml changes apply after merging to main.
on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions: read-all

jobs:
  run:
    cache-mode: read
    uses: kenn-io/docbank/.github/workflows/ci.yml@main

  gate:
    name: CI gate
    needs: run
    if: always()
    runs-on: namespace-profile-linux-1cpu
    steps:
      - name: Require successful CI
        if: needs.run.result != 'success'
        run: exit 1
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Preserve base schema records
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          files=$(git diff --no-renames --diff-filter=DMT --name-only "$BASE_SHA" HEAD -- internal/store/testdata/schema-contracts)
          if [ -n "$files" ]; then
            echo "::error::Base schema records were changed or deleted and must be restored: $files. Run go test -tags fts5 ./internal/store -run TestStorageSchemaVersionContract and add a marker for the current schema version if needed."
            exit 1
          fi
