name: CI

# Temporarily run the proposed workflow revision to measure its test reports.
on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions: read-all

jobs:
  run:
    cache-mode: read
    uses: kenn-io/docbank/.github/workflows/ci.yml@4fafdfc6c1c07329de9b64b8c47915ec374ecfe9

  gate:
    name: CI gate
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI
        if: needs.run.result != 'success'
        run: exit 1
