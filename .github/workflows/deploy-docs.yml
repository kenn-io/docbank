name: Deploy documentation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docbank-documentation-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish documentation
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out the selected branch or tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.4.4

      - name: Check upload inputs, build, and publish
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: ./scripts/deploy-docs.sh
