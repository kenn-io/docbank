name: MinIO timing

on:
  push:
    branches: [tmp/minio-timing]

jobs:
  hosted:
    name: MinIO timing on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/minio-timing
        with:
          runner: ubuntu-latest
          cache: 'true'

  self-hosted:
    name: MinIO timing on kenn-linux-x64-public
    if: github.repository == 'kenn-io/docbank'
    runs-on: kenn-linux-x64-public
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/minio-timing
        with:
          runner: kenn-linux-x64-public
          cache: 'false'
