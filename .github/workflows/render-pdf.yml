name: Render PDF

# Keep native renderer proof on disposable GitHub-hosted runners. PR changes
# must exercise this job without changing the main-pinned CI workflow.
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # "|" falls back to the source repo on any proxy error, including HTTP/2 stream resets mid-download.
  GOPROXY: https://proxy.golang.org|direct
  # Compile without absolute source paths, like the Makefile does.
  GOFLAGS: -trimpath

jobs:
  bates-browser-recovery:
    name: Numbered PDF browser recovery
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Poppler and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils util-linux
          npm --prefix frontend ci
          node frontend/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Embed frontend and qualify both SQLite modes
        run: |
          npm --prefix frontend run build
          find internal/web/dist -mindepth 1 ! -name .keep -exec rm -rf {} +
          cp -R frontend/dist/. internal/web/dist/
          node frontend/screenshots/bates-recovery.run.mjs

  libreoffice-owner:
    name: LibreOffice owner proof
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Select package archive cache key
        id: apt_key
        run: echo "key=pdf-apt-${ImageOS}-${ImageVersion}-$(dpkg --print-architecture)-${{ hashFiles('.github/workflows/render-pdf.yml') }}" >> "$GITHUB_OUTPUT"

      - name: Restore package archives
        id: apt_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pdf-apt-archives/*.deb
          key: ${{ steps.apt_key.outputs.key }}

      - name: Download package archives on a cache miss
        if: steps.apt_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/pdf-apt-archives/partial"
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/pdf-apt-archives" install --download-only --no-install-recommends -y libreoffice-writer libreoffice-impress libreoffice-calc poppler-utils

      - name: Install LibreOffice Writer, Impress, Calc, and Poppler runtimes
        run: sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/pdf-apt-archives" install --no-download --no-install-recommends -y "$RUNNER_TEMP"/pdf-apt-archives/*.deb

      - name: Run mandatory page rendering proof
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          command -v pdftoppm
          command -v prlimit
          go test -tags fts5 -v ./document/pagerender/ ./internal/processing/ -run '^(TestRealRuntimeInspectAndRenderPDFAndPNG|TestRealPageWorkerPublishesVerifiedImagesAndResumesExactJobs|TestRealPageAPIBackupRestoreAndGC)$' -count=1
          go test -tags fts5 -v -p 1 \
            ./internal/production/ ./internal/pdfproduction/ ./internal/processing/ \
            ./internal/api/ ./internal/daemonconn/ -run '^(TestAlign(QualifiedFont|FontProof)|TestNativeFont|TestInspectNativeTextFromInspection|TestRedaction|TestNativeRedactionRender|TestNumberedRedaction|TestNumberedDownload)' -count=1
          if ! go test -tags fts5 -json ./cmd/docbank/ -run '^(TestNativePDF(Preparation|Redaction|RedactionRecovery)CLI|TestNumberedNativePDFCLI)$' -count=1 > /tmp/native-redaction-proof.jsonl; then
            cat /tmp/native-redaction-proof.jsonl
            exit 1
          fi
          cat /tmp/native-redaction-proof.jsonl
          python3 -I - /tmp/native-redaction-proof.jsonl <<'PY'
          import json, sys
          events = [json.loads(line) for line in open(sys.argv[1])]
          for name in ("TestNativePDFPreparationCLI", "TestNativePDFRedactionCLI",
                       "TestNativePDFRedactionRecoveryCLI", "TestNumberedNativePDFCLI"):
              outcomes = [event["Action"] for event in events
                          if event.get("Test") == name and event["Action"] in ("pass", "fail", "skip")]
              if outcomes != ["pass"]:
                  raise SystemExit(f"{name}: expected one unskipped pass, got {outcomes}")
          PY

      - name: Run mandatory owner proof
        env:
          CGO_ENABLED: "0"
          DOCBANK_TEST_LIBREOFFICE_EXECUTABLE: /usr/lib/libreoffice/program/soffice.bin
          DOCBANK_TEST_REQUIRE_SANDBOX: "1"
        run: |
          set -eu
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/user/max_user_namespaces ]; then
            sudo sysctl -w user.max_user_namespaces=15000
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          test -x "$DOCBANK_TEST_LIBREOFFICE_EXECUTABLE"
          go test -tags fts5 -v ./document/internal/providerutil/sandbox/ ./document/trafilatura/ -count=1
          go test -tags fts5 -v ./document/renderpdf/ -run '^TestLibreOffice' -count=1
          go test -tags fts5 -v ./document/mistral/ -run '^(TestDOCXLibreOfficeRoute|TestRenderLaneLibreOfficeRoute)$' -count=1

      - name: Save package archives
        if: >-
          steps.apt_cache.outputs.cache-hit != 'true'
          && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
          || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pdf-apt-archives/*.deb
          key: ${{ steps.apt_key.outputs.key }}
