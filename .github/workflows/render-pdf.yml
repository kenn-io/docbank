name: Render PDF

# Keep native renderer proof on disposable GitHub-hosted runners. PR changes
# must exercise this job without changing the main-pinned CI workflow.
# The LibreOffice proof uses the prebuilt image from .github/docker/render-pdf.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTRACEBACK: all
  # "|" falls back to the source repo on any proxy error, including HTTP/2 stream resets mid-download.
  GOPROXY: https://proxy.golang.org|direct
  # Compile without absolute source paths, like the Makefile does.
  GOFLAGS: -trimpath

jobs:
  email-pdf-memory-proof:
    name: Email PDF memory proof
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3
      - name: Prepare pinned renderer without changing host policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/email-proof/fonts" "$RUNNER_TEMP/email-proof/bin"
          cd "$RUNNER_TEMP/email-proof"
          kit-download https://storage.googleapis.com/chrome-for-testing-public/151.0.7922.34/linux64/chrome-linux64.zip chrome.zip
          echo 'ae8736ac28bc69278551500f219fc749575648263c43ec5990749eff43b9fcf8  chrome.zip' | sha256sum -c -
          python3 -m zipfile -e chrome.zip .
          chmod +x chrome-linux64/chrome chrome-linux64/chrome_crashpad_handler
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf fonts/
          if ! command -v bwrap >/dev/null; then
            kit-retry 3 5 apt-get download bubblewrap
            dpkg-deb -x bubblewrap_*.deb bubblewrap
            cp bubblewrap/usr/bin/bwrap bin/
          fi
          echo "$RUNNER_TEMP/email-proof/bin" >> "$GITHUB_PATH"
          systemctl --user show --property=ControlGroup --value
      - name: Run real Chromium memory proof
        shell: bash
        env:
          DOCBANK_EMAILPDF_TEST_BUNDLE: ${{ runner.temp }}/email-proof/chrome-linux64
          DOCBANK_EMAILPDF_TEST_FONTS: ${{ runner.temp }}/email-proof/fonts
          DOCBANK_EMAILPDF_TEST_WORKER: ${{ runner.temp }}/email-proof/docbank
        run: |
          set -euo pipefail
          go build -tags fts5 -o "$DOCBANK_EMAILPDF_TEST_WORKER" ./cmd/docbank
          go test -tags fts5 -v ./document/emailpdf/ -run '^TestRuntimeRealLimits$/^chromium-memory-pressure$' -count=1

  changes:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      groups: ${{ steps.changes.outputs.groups }}
      all: ${{ steps.changes.outputs.all }}
    steps:
      - id: changes
        uses: kenn-io/actions/changes@main
        with:
          filters: |
            go:
              - '!{README.md,AGENTS.md,CLAUDE.md,docs/**,website/**,frontend/**}'
            frontend:
              - frontend/**

  redaction-browser-review:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.groups), 'go') || contains(fromJSON(needs.changes.outputs.groups), 'frontend')) }}
    name: Browser PDF redaction review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      - name: Install Poppler and Chromium
        run: |
          # Match runner-images' bounded mirror failover, including Playwright's apt calls.
          # https://github.com/actions/runner-images/issues/14594
          printf '%s\n' 'Acquire::Retries "1";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' |
            sudo tee /etc/apt/apt.conf.d/zz-retries
          kit-retry 3 5 sudo apt-get -o APT::Update::Error-Mode=any update
          kit-retry 3 5 sudo apt-get install --no-install-recommends -y poppler-utils util-linux
          kit-retry 3 5 npm --prefix frontend ci
          kit-retry 3 5 node frontend/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Embed frontend and qualify both SQLite modes
        run: |
          npm --prefix frontend run build
          find internal/web/dist -mindepth 1 ! -name .keep -exec rm -rf {} +
          cp -R frontend/dist/. internal/web/dist/
          node frontend/screenshots/redaction-review.run.mjs

  bates-browser-recovery:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.groups), 'go') || contains(fromJSON(needs.changes.outputs.groups), 'frontend')) }}
    name: Numbered PDF browser recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      - name: Install Poppler and Chromium
        run: |
          # Match runner-images' bounded mirror failover, including Playwright's apt calls.
          # https://github.com/actions/runner-images/issues/14594
          printf '%s\n' 'Acquire::Retries "1";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' |
            sudo tee /etc/apt/apt.conf.d/zz-retries
          kit-retry 3 5 sudo apt-get -o APT::Update::Error-Mode=any update
          kit-retry 3 5 sudo apt-get install --no-install-recommends -y poppler-utils util-linux
          kit-retry 3 5 npm --prefix frontend ci
          kit-retry 3 5 node frontend/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Embed frontend and qualify both SQLite modes
        run: |
          npm --prefix frontend run build
          find internal/web/dist -mindepth 1 ! -name .keep -exec rm -rf {} +
          cp -R frontend/dist/. internal/web/dist/
          node frontend/screenshots/bates-recovery.run.mjs

  ensure_image:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.groups), 'go')) }}
    name: Resolve Render PDF image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    env:
      IMAGE: ghcr.io/kenn-io/docbank-render-pdf
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Render PDF image
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          dockerfile=.github/docker/render-pdf/Dockerfile
          recipe_digest="$(sha256sum "$dockerfile" | cut -d' ' -f1)"
          image_tag="${IMAGE}:recipe-${recipe_digest:0:16}"

          if inspect_output="$(docker buildx imagetools inspect "$image_tag" 2>&1)"; then
            echo "Reusing $image_tag"
          elif grep -Eqi 'manifest unknown|not found|no such manifest' <<<"$inspect_output"; then
            echo "::error::The Render PDF image is missing. Run the Render PDF image workflow from a trusted branch with this Dockerfile, then rerun the proofs."
            exit 1
          else
            echo "$inspect_output" >&2
            exit 1
          fi

          manifest_digest="$(docker buildx imagetools inspect "$image_tag" --format '{{json .Manifest}}' | jq -er .digest)"
          echo "image=${IMAGE}@${manifest_digest}" >> "$GITHUB_OUTPUT"

  libreoffice-owner:
    needs: [changes, ensure_image]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.groups), 'go')) && needs.ensure_image.result == 'success' }}
    name: LibreOffice owner proof
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      GOPATH: /home/proof/go
      GOCACHE: /home/proof/.cache/go-build
      DOCBANK_TEST_REQUIRE_SANDBOX: "1"
    permissions:
      contents: read
    container:
      image: ${{ needs.ensure_image.outputs.image }}
      options: --privileged
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare unprivileged sandbox proofs
        run: |
          set -eu
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/user/max_user_namespaces ]; then
            sysctl -w user.max_user_namespaces=15000
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          mkdir -p "$GOPATH" "$GOCACHE"
          chown -R proof:proof "$GITHUB_WORKSPACE" /home/proof

      - name: Run mandatory page rendering proof
        shell: setpriv --reuid=proof --regid=proof --init-groups env HOME=/home/proof sh -e {0}
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          command -v pdftoppm
          command -v prlimit
          go test -tags fts5 -v ./document/pagerender/ ./internal/processing/ -run '^(TestRealRuntimeInspectAndRenderPDFAndPNG|TestRealPageWorkerPublishesVerifiedImagesAndResumesExactJobs|TestRealPageAPIBackupRestoreAndGC)$' -count=1
          go test -tags fts5 -v -p 1 \
            ./internal/production/ ./internal/pdfproduction/ ./internal/processing/ \
            ./internal/api/ ./internal/daemonconn/ -run '^(TestAlign(QualifiedFont|FontProof)|TestNativeFont|TestNativeSource|TestNativeGeometryPipeline|TestInspectNativeTextFromInspection|TestRedaction|TestNativeRedactionRender|TestNumberedRedaction|TestNumberedDownload)' -count=1
          if ! go test -tags fts5 -json ./cmd/docbank/ -run '^(TestNativePDF(Preparation|Redaction|RedactionRecovery)CLI|TestNumberedNativePDFCLI|TestNumberedRecipientPackageCLI)$' -count=1 > /tmp/native-redaction-proof.jsonl; then
            cat /tmp/native-redaction-proof.jsonl
            exit 1
          fi
          cat /tmp/native-redaction-proof.jsonl
          python3 -I - /tmp/native-redaction-proof.jsonl <<'PY'
          import json, sys
          events = [json.loads(line) for line in open(sys.argv[1])]
          for name in ("TestNativePDFPreparationCLI", "TestNativePDFRedactionCLI",
                       "TestNativePDFRedactionRecoveryCLI", "TestNumberedNativePDFCLI",
                       "TestNumberedRecipientPackageCLI"):
              outcomes = [event["Action"] for event in events
                          if event.get("Test") == name and event["Action"] in ("pass", "fail", "skip")]
              if outcomes != ["pass"]:
                  raise SystemExit(f"{name}: expected one unskipped pass, got {outcomes}")
          PY

      - name: Run mandatory owner proof
        shell: setpriv --reuid=proof --regid=proof --init-groups env HOME=/home/proof sh -e {0}
        env:
          CGO_ENABLED: "0"
          DOCBANK_TEST_LIBREOFFICE_EXECUTABLE: /usr/lib/libreoffice/program/soffice.bin
        run: |
          set -eu
          test -x "$DOCBANK_TEST_LIBREOFFICE_EXECUTABLE"
          go test -tags fts5 -v ./document/internal/providerutil/sandbox/ ./document/trafilatura/ -count=1
          go test -tags fts5 -v ./document/renderpdf/ -run '^TestLibreOffice' -count=1
          go test -tags fts5 -v ./document/mistral/ -run '^(TestDOCXLibreOfficeRoute|TestRenderLaneLibreOfficeRoute)$' -count=1
