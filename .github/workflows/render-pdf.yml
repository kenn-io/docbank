name: Render PDF

# Keep native renderer proof on disposable GitHub-hosted runners. PR changes
# must exercise this job without changing the main-pinned managed CI workflow.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  libreoffice-owner:
    name: LibreOffice owner proof
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install LibreOffice Writer and Poppler runtimes
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libreoffice-writer poppler-utils

      - name: Run mandatory page rendering proof
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          command -v pdftoppm
          command -v prlimit
          go test -tags fts5 -v ./document/pagerender/ ./internal/processing/ -run '^(TestRealRuntimeInspectAndRenderPDFAndPNG|TestRealPageWorkerPublishesVerifiedImagesAndResumesExactJobs|TestRealPageAPIBackupRestoreAndGC)$' -count=1

      - name: Run mandatory owner proof
        env:
          CGO_ENABLED: "0"
          DOCBANK_TEST_LIBREOFFICE_EXECUTABLE: /usr/lib/libreoffice/program/soffice.bin
          DOCBANK_TEST_REQUIRE_SANDBOX: "1"
        run: |
          set -eu
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/user/max_user_namespaces ]; then
            sudo sysctl -w user.max_user_namespaces=15000
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          test -x "$DOCBANK_TEST_LIBREOFFICE_EXECUTABLE"
          go test -tags fts5 -v ./document/internal/providerutil/sandbox/ ./document/trafilatura/ -count=1
          go test -tags fts5 -v ./document/renderpdf/ -run '^TestLibreOffice' -count=1
