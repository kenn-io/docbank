name: CI

# Throwaway workflow for the push upload stall investigation. Never merge.
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  push-stall:
    name: Push stall ${{ matrix.load }} ${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, goarch: amd64, load: quiet }
          - { runner: windows-2025, goarch: amd64, load: loaded }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CGO_ENABLED: "1"
      GOPROXY: https://proxy.golang.org|direct
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build tests
        shell: pwsh
        run: |
          go test -tags fts5 -count=1 -run '^$' ./internal/push/ ./internal/ingest/ ./internal/mailbox/ ./internal/pdfproduction/ ./internal/checkout/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run push test
        shell: pwsh
        run: |
          $load = $null
          if ('${{ matrix.load }}' -eq 'loaded') {
            $load = Start-Process -PassThru -NoNewWindow -FilePath go -ArgumentList @('test','-tags','fts5','-count=1','./internal/ingest/','./internal/mailbox/','./internal/pdfproduction/','./internal/checkout/') -RedirectStandardOutput load.out -RedirectStandardError load.err
            Start-Sleep -Seconds 20
          }
          go test -tags fts5 -count=6 -timeout 40m -v -run 'TestPushOverlapsUploadsAndHandlesCancellation/canceled=false' ./internal/push/ *> push.log
          $code = $LASTEXITCODE
          if ($load) { $load | Wait-Process -Timeout 1800 -ErrorAction SilentlyContinue }
          Get-Content push.log
          exit 0
