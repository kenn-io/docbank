name: CI

on:
  workflow_call:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # "|" falls back to the source repo on any proxy error, including HTTP/2 stream resets mid-download.
  GOPROXY: https://proxy.golang.org|direct

jobs:
  docs:
    name: Public documentation
    runs-on: namespace-profile-linux-4cpu
    steps:
      - name: Check out full repository history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned documentation tools
        run: |
          ./scripts/vercel-install-docs.sh
          echo "$PWD/.vercel-tools/bin" >> "$GITHUB_PATH"

      - name: Install browser test dependencies
        run: |
          npm ci --prefix frontend
          node frontend/node_modules/@playwright/test/cli.js install chromium webkit

      - name: Verify documentation sources and assets
        run: |
          bash scripts/docs-assets-sync.test.sh
          npm --prefix frontend run screenshots:check
          make docs-subpath-test
          node --test scripts/docs/*.test.mjs
          make docs-build

      - name: Verify documentation upload inputs locally
        run: node scripts/docs/check-upload-inputs.mjs

      - name: Verify documentation in Chromium and WebKit
        run: |
          npm --prefix frontend run docs-site:check
          npm --prefix frontend run docs-site:test

  frontend:
    name: Web application
    runs-on: namespace-profile-linux-8cpu
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check and build web application
        run: make frontend-test

  report-export-browser:
    name: Browser reports and original exports
    runs-on: namespace-profile-linux-8cpu
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Chromium
        run: |
          npm ci --prefix frontend
          node frontend/node_modules/@playwright/test/cli.js install chromium

      - name: Qualify browser workflow with both SQLite builds
        run: make report-export-browser-test

  test:
    name: Linux tests
    runs-on: namespace-profile-linux-16cpu
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check Unix installer
        run: sh -n scripts/install.sh

      - name: Check Huma API contract
        run: go run go.kenn.io/kit/cmd/huma-check@3e1f59e9011e878ec595aa04aebc8a77c5292c4d -fix=false -tags fts5 ./...

      - name: Vet
        run: go vet -tags fts5 ./...

      - name: Start S3-compatible test service
        env:
          RUSTFS_ACCESS_KEY: docbank-test
          RUSTFS_SECRET_KEY: docbank-test-secret
        run: |
          set -eu
          name="docbank-s3-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # MinIO no longer publishes images, so tests run against RustFS 1.0.0.
          image="docker.io/rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff"
          if ! docker image inspect "$image" >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if docker pull "$image"; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi
          echo "DOCBANK_S3_CONTAINER=$name" >> "$GITHUB_ENV"
          docker run --rm -d --name "$name"             -p 127.0.0.1::9000             -e RUSTFS_ACCESS_KEY -e RUSTFS_SECRET_KEY             "$image" >/dev/null
          port="$(docker port "$name" 9000/tcp | head -1 | awk -F: '{print $NF}')"
          endpoint="http://127.0.0.1:${port}"
          for _ in $(seq 1 30); do
            if curl --fail --silent "${endpoint}/health/ready" >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent "${endpoint}/health/ready" >/dev/null; then
            docker logs "$name"
            exit 1
          fi
          {
            echo "DOCBANK_S3_TEST_ENDPOINT=$endpoint"
            echo "DOCBANK_S3_TEST_ACCESS_KEY=$RUSTFS_ACCESS_KEY"
            echo "DOCBANK_S3_TEST_SECRET_KEY=$RUSTFS_SECRET_KEY"
          } >> "$GITHUB_ENV"

      - name: Test
        run: |
          # The deadline-lint branch deletes this script; skip it there until that lands.
          if [ -d scripts/check-timing-budgets ]; then make check-timing-budgets; fi
          bash scripts/test-go-ci.sh

      - name: Embedded modernc restore without FTS5 build tags
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -run '^TestRepositoryRestoreAfterSourceLoss/modernc$' .

      - name: Stop S3-compatible test service
        if: always()
        run: |
          if [ -n "${DOCBANK_S3_CONTAINER:-}" ]; then
            docker rm -f "$DOCBANK_S3_CONTAINER" >/dev/null 2>&1 || true
          fi

  purego:
    name: Pure-Go SQLite
    runs-on: namespace-profile-linux-16cpu
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet -tags fts5 ./...

      - name: Test
        run: bash scripts/test-go-ci.sh

  lint:
    name: golangci-lint
    runs-on: namespace-profile-linux-8cpu
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

      - name: Run golangci-lint for Windows
        if: hashFiles('.custom-gcl.yml') == ''
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: windows
        with:
          version: v2.13.1

      # With a plugin build, reuse the binary the first step built; the action would build it for Windows.
      - name: Run custom golangci-lint for Windows
        if: hashFiles('.custom-gcl.yml') != ''
        env:
          GOOS: windows
        run: ./custom-gcl run ./...

  windows:
    name: Windows ${{ matrix.goarch }}${{ matrix.shard && format(' shard {0}', matrix.shard) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: namespace-profile-windows-8cpu, goarch: amd64 }
          # The 4 vCPU arm64 runner is saturated by the full suite, so its packages split across two.
          - { runner: windows-11-vs2026-arm, goarch: arm64, shard: 1 }
          - { runner: windows-11-vs2026-arm, goarch: arm64, shard: 2 }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check PowerShell installer
        if: matrix.goarch == 'amd64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [scriptblock]::Create((Get-Content -Raw scripts/install.ps1)) | Out-Null

      - name: Set up ARM64 C compiler
        if: matrix.goarch == 'arm64'
        shell: pwsh
        env:
          LLVM_MINGW_VERSION: "20260602"
          LLVM_MINGW_NAME: llvm-mingw-20260602-ucrt-aarch64
          LLVM_MINGW_SHA256: cb5c20fbe1808e31ada5cbe4efd9daa2fee19c91dac6ec5ca1ac46a9c7247e37
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$env:LLVM_MINGW_NAME.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:LLVM_MINGW_SHA256) {
            throw "Checksum mismatch for $url`n  expected $env:LLVM_MINGW_SHA256`n  actual   $actual"
          }
          7z x $zip -o"$env:RUNNER_TEMP" | Out-Null
          $cc = Join-Path $env:RUNNER_TEMP "$env:LLVM_MINGW_NAME\bin\aarch64-w64-mingw32-clang.exe"
          if (-not (Test-Path $cc)) { throw "CC not found at $cc" }
          Add-Content -Path $env:GITHUB_ENV -Value "CC=$cc"

      - name: Build
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
        run: go build -tags fts5 ./...

      - name: Vet
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
        run: go vet -tags fts5 ./...

      - name: Test
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
        shell: pwsh
        run: ./scripts/test-go-ci.ps1 -Shard ${{ matrix.shard || 'all' }}
