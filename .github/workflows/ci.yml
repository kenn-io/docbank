name: CI

on:
  workflow_call:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Web application
    runs-on: ${{ github.repository == 'kenn-io/docbank' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check and build web application
        run: make frontend-test

  test:
    name: Linux tests
    runs-on: ${{ github.repository == 'kenn-io/docbank' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: ${{ github.repository == 'kenn-io/docbank' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'false' || 'true' }}

      - name: Check Unix installer
        run: sh -n scripts/install.sh

      - name: Vet
        run: go vet -tags fts5 ./...

      - name: Start S3-compatible test service
        env:
          MINIO_ROOT_USER: docbank-test
          MINIO_ROOT_PASSWORD: docbank-test-secret
        run: |
          set -eu
          name="docbank-minio-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --rm -d --name "$name" \
            -p 127.0.0.1::9000 \
            -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data >/dev/null
          port="$(docker port "$name" 9000/tcp | head -1 | awk -F: '{print $NF}')"
          endpoint="http://127.0.0.1:${port}"
          for _ in $(seq 1 30); do
            if curl --fail --silent "${endpoint}/minio/health/live" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "${endpoint}/minio/health/live" >/dev/null
          echo "DOCBANK_MINIO_CONTAINER=$name" >> "$GITHUB_ENV"
          echo "DOCBANK_S3_TEST_ENDPOINT=$endpoint" >> "$GITHUB_ENV"
          echo "DOCBANK_S3_TEST_ACCESS_KEY=$MINIO_ROOT_USER" >> "$GITHUB_ENV"
          echo "DOCBANK_S3_TEST_SECRET_KEY=$MINIO_ROOT_PASSWORD" >> "$GITHUB_ENV"

      - name: Test
        run: make test

      - name: Stop S3-compatible test service
        if: always()
        run: |
          if [ -n "${DOCBANK_MINIO_CONTAINER:-}" ]; then
            docker rm -f "$DOCBANK_MINIO_CONTAINER" >/dev/null 2>&1 || true
          fi

  purego:
    name: Pure-Go SQLite
    runs-on: ${{ github.repository == 'kenn-io/docbank' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: ${{ github.repository == 'kenn-io/docbank' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'false' || 'true' }}

      - name: Vet
        run: go vet -tags fts5 ./...

      - name: Test
        run: go test -timeout 20m -tags fts5 ./...

  lint:
    name: golangci-lint
    runs-on: ${{ github.repository == 'kenn-io/docbank' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: ${{ github.repository == 'kenn-io/docbank' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'false' || 'true' }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

  windows:
    name: Windows ${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, goarch: amd64 }
          - { runner: windows-11-vs2026-arm, goarch: arm64 }
    runs-on: ${{ contains(fromJSON('["ubuntu-latest","ubuntu-24.04","ubuntu-22.04"]'), matrix.runner) && github.repository == 'kenn-io/docbank' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: ${{ contains(fromJSON('["ubuntu-latest","ubuntu-24.04","ubuntu-22.04"]'), matrix.runner) && github.repository == 'kenn-io/docbank' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'false' || 'true' }}

      - name: Check PowerShell installer
        if: matrix.goarch == 'amd64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [scriptblock]::Create((Get-Content -Raw scripts/install.ps1)) | Out-Null

      - name: Set up ARM64 C compiler
        if: matrix.goarch == 'arm64'
        shell: pwsh
        env:
          LLVM_MINGW_VERSION: "20260602"
          LLVM_MINGW_NAME: llvm-mingw-20260602-ucrt-aarch64
          LLVM_MINGW_SHA256: cb5c20fbe1808e31ada5cbe4efd9daa2fee19c91dac6ec5ca1ac46a9c7247e37
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$env:LLVM_MINGW_NAME.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:LLVM_MINGW_SHA256) {
            throw "Checksum mismatch for $url`n  expected $env:LLVM_MINGW_SHA256`n  actual   $actual"
          }
          7z x $zip -o"$env:RUNNER_TEMP" | Out-Null
          $cc = Join-Path $env:RUNNER_TEMP "$env:LLVM_MINGW_NAME\bin\aarch64-w64-mingw32-clang.exe"
          if (-not (Test-Path $cc)) { throw "CC not found at $cc" }
          Add-Content -Path $env:GITHUB_ENV -Value "CC=$cc"

      - name: Build
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
        run: go build -tags fts5 ./...

      - name: Vet
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
        run: go vet -tags fts5 ./...

      - name: Test
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
        run: go test -timeout 20m -tags fts5 ./...
