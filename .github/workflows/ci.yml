name: CI

# Throwaway workflow for the push upload stall investigation. Never merge.
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  push-stall:
    name: Push stall ${{ matrix.load }} temp ${{ matrix.tempdisk }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, goarch: amd64, load: loaded, tempdisk: C }
          - { runner: windows-2025, goarch: amd64, load: loaded, tempdisk: D }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CGO_ENABLED: "1"
      GOPROXY: https://proxy.golang.org|direct
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build tests
        shell: pwsh
        run: |
          go test -tags fts5 -count=1 -run '^$' ./internal/push/ ./internal/ingest/ ./internal/mailbox/ ./internal/pdfproduction/ ./internal/checkout/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run push test
        shell: pwsh
        run: |
          if ('${{ matrix.tempdisk }}' -eq 'D') {
            $env:TEMP = $env:RUNNER_TEMP
            $env:TMP = $env:RUNNER_TEMP
          }
          $load = $null
          if ('${{ matrix.load }}' -eq 'loaded') {
            $load = Start-Process -PassThru -NoNewWindow -FilePath go -ArgumentList @('test','-tags','fts5','-count=1','./internal/ingest/','./internal/mailbox/','./internal/pdfproduction/','./internal/checkout/') -RedirectStandardOutput load.out -RedirectStandardError load.err
            Start-Sleep -Seconds 5
          }
          Write-Output "TEMP=$env:TEMP"
          Get-Volume | Format-Table -AutoSize | Out-String | Write-Output
          $counters = Start-Process -PassThru -NoNewWindow -FilePath typeperf -ArgumentList '"\PhysicalDisk(*)\Avg. Disk sec/Write" "\PhysicalDisk(*)\Avg. Disk sec/Transfer" "\PhysicalDisk(*)\Current Disk Queue Length" "\Processor(_Total)\% Processor Time" "\Memory\Pages/sec" "\Memory\Available MBytes" -si 1 -o counters.csv -f CSV -y'
          $env:PUSHDBG_HEARTBEAT = '1'
          $deadline = (Get-Date).AddMinutes(8)
          $round = 0
          do {
            $round++
            Write-Output "=== round $round $((Get-Date).ToUniversalTime().ToString('HH:mm:ss'))" *>> push.log
            go test -tags fts5 -count=5 -timeout 20m -v -run 'TestPushOverlapsUploadsAndHandlesCancellation/canceled=false' ./internal/push/ *>> push.log
          } while ($load -and -not $load.HasExited -and (Get-Date) -lt $deadline)
          $env:PUSHDBG_HEARTBEAT = ''
          if ($load) { $load | Wait-Process -Timeout 1800 -ErrorAction SilentlyContinue }
          Stop-Process -Id $counters.Id -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Get-Content push.log
          Write-Output '=== counters'
          Get-Content counters.csv
          exit 0
