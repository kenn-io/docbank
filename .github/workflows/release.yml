name: release

on:
  workflow_call:
permissions:
  contents: read

concurrency:
  group: release-build-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-frontend:
    name: Build web application
    runs-on: ${{ github.repository == 'kenn-io/docbank' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run check:kit-ui
          npm test
          npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-assets
          path: frontend/dist/
          if-no-files-found: error

  build-linux:
    name: Build linux/${{ matrix.goarch }}
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goarch: arm64 }
    runs-on: ${{ matrix.goarch == 'amd64' && github.repository == 'kenn-io/docbank' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || matrix.runner }}
    container:
      image: ubuntu:22.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates file git gzip tar

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets
          path: internal/web/dist

      - name: Build and package
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
          GOOS: linux
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "FATAL: release tag must use vX.Y.Z format" >&2
            exit 1
          fi
          COMMIT="$(printf '%s' "${GITHUB_SHA}" | cut -c1-8)"
          LDFLAGS="-s -w -X go.kenn.io/docbank/internal/version.Version=${VERSION} -X go.kenn.io/docbank/internal/version.Commit=${COMMIT}"
          go build -tags fts5 -trimpath -buildvcs=false -ldflags "${LDFLAGS}" -o dist/docbank ./cmd/docbank
          file dist/docbank
          SMOKE_OUT="$(dist/docbank version 2>&1)"
          echo "${SMOKE_OUT}"
          grep -Fq "docbank version ${VERSION} (${COMMIT})" <<<"${SMOKE_OUT}"
          cd dist
          tar -czf "docbank_${VERSION}_linux_${GOARCH}.tar.gz" docbank
          rm docbank

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docbank-linux-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  build-darwin:
    name: Build darwin/${{ matrix.goarch }}
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets
          path: internal/web/dist

      - name: Build and package
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
          GOOS: darwin
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "FATAL: release tag must use vX.Y.Z format" >&2
            exit 1
          fi
          COMMIT="$(printf '%s' "${GITHUB_SHA}" | cut -c1-8)"
          LDFLAGS="-s -w -X go.kenn.io/docbank/internal/version.Version=${VERSION} -X go.kenn.io/docbank/internal/version.Commit=${COMMIT}"
          go build -tags fts5 -trimpath -buildvcs=false -ldflags "${LDFLAGS}" -o dist/docbank ./cmd/docbank
          file dist/docbank
          otool -L dist/docbank
          if [[ "${GOARCH}" == "arm64" ]]; then
            SMOKE_OUT="$(dist/docbank version 2>&1)"
            echo "${SMOKE_OUT}"
            grep -Fq "docbank version ${VERSION} (${COMMIT})" <<<"${SMOKE_OUT}"
          fi
          cd dist
          tar -czf "docbank_${VERSION}_darwin_${GOARCH}.tar.gz" docbank
          rm docbank

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docbank-darwin-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build windows/${{ matrix.goarch }}
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, goarch: amd64 }
          - { runner: windows-11-arm, goarch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-assets
          path: internal/web/dist

      - name: Set up ARM64 C compiler
        if: matrix.goarch == 'arm64'
        shell: pwsh
        env:
          LLVM_MINGW_VERSION: "20260602"
          LLVM_MINGW_NAME: llvm-mingw-20260602-ucrt-aarch64
          LLVM_MINGW_SHA256: cb5c20fbe1808e31ada5cbe4efd9daa2fee19c91dac6ec5ca1ac46a9c7247e37
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$env:LLVM_MINGW_NAME.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:LLVM_MINGW_SHA256) {
            throw "Checksum mismatch for $url`n  expected $env:LLVM_MINGW_SHA256`n  actual   $actual"
          }
          7z x $zip -o"$env:RUNNER_TEMP" | Out-Null
          $cc = Join-Path $env:RUNNER_TEMP "$env:LLVM_MINGW_NAME\bin\aarch64-w64-mingw32-clang.exe"
          if (-not (Test-Path $cc)) { throw "CC not found at $cc" }
          Add-Content -Path $env:GITHUB_ENV -Value "CC=$cc"

      - name: Build and package
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
          GOOS: windows
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "FATAL: release tag must use vX.Y.Z format" >&2
            exit 1
          fi
          printf 'RELEASE_VERSION=%s\n' "${VERSION}" >> "${GITHUB_ENV}"
          COMMIT="$(printf '%s' "${GITHUB_SHA}" | cut -c1-8)"
          LDFLAGS="-s -w -X go.kenn.io/docbank/internal/version.Version=${VERSION} -X go.kenn.io/docbank/internal/version.Commit=${COMMIT}"
          go build -tags fts5 -trimpath -buildvcs=false -ldflags "${LDFLAGS}" -o dist/docbank.exe ./cmd/docbank
          SMOKE_OUT="$(dist/docbank.exe version 2>&1)"
          echo "${SMOKE_OUT}"
          grep -Fq "docbank version ${VERSION} (${COMMIT})" <<<"${SMOKE_OUT}"

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/docbank.exe -DestinationPath "dist/docbank_$($env:RELEASE_VERSION)_windows_${{ matrix.goarch }}.zip"
          Remove-Item dist/docbank.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docbank-windows-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error
