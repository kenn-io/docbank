name: Voice transcription qualification
on:
  push:
    branches: [feat/voice-memo-transcription]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voice-transcription-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cgo: ['1', '0']
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      GOFLAGS: -trimpath
      GOPROXY: https://proxy.golang.org|direct
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3
      - name: Download modules
        run: kit-retry 3 5 go mod download
      - name: Exercise audio contracts and lifecycle
        run: go test -tags fts5 -timeout 20m ./document/docling ./document/media ./internal/processing ./internal/api ./internal/config ./cmd/docbank
  generated-api:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3
      - name: Download modules and frontend dependencies
        run: |
          kit-retry 3 5 go mod download
          kit-retry 3 5 npm ci --prefix frontend
      - name: Generate clients from implemented routes
        run: make generate-api
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: voice-generated-api
          path: |
            internal/api/openapi.yaml
            internal/apiclient/client.gen.go
            frontend/src/generated/docbank.ts
          retention-days: 7
  real-asr:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: 'false'
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3
      - name: Install isolated ASR dependencies
        run: |
          kit-retry 3 5 sudo apt-get update
          kit-retry 3 5 sudo apt-get install -y ffmpeg python3-venv
          python3 -m venv .superpowers/asr-venv
          kit-retry 3 5 .superpowers/asr-venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          kit-retry 3 5 .superpowers/asr-venv/bin/pip install 'docling-serve==1.32.0' 'docling-slim==2.124.0' 'docling-core==2.105.0' 'docling-jobkit==3.5.0' openai-whisper
          kit-retry 3 5 go mod download
      - name: Qualify real AAC decode and speech recognition
        run: .superpowers/asr-venv/bin/python scripts/qualify-voice-asr.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: voice-real-asr
          path: .superpowers/asr-qualification/
          retention-days: 7
