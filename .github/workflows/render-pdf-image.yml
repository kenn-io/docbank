name: Render PDF image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish Render PDF image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kenn-io/docbank-render-pdf
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish missing Render PDF image
        shell: bash
        run: |
          set -euo pipefail

          dockerfile=.github/docker/render-pdf/Dockerfile
          recipe_digest="$(sha256sum "$dockerfile" | cut -d' ' -f1)"
          image_tag="${IMAGE}:recipe-${recipe_digest:0:16}"

          if inspect_output="$(docker buildx imagetools inspect "$image_tag" 2>&1)"; then
            echo "Reusing $image_tag"
          elif grep -Eqi 'manifest unknown|not found|no such manifest' <<<"$inspect_output"; then
            docker buildx build \
              --platform linux/amd64 \
              --provenance=false \
              --tag "$image_tag" \
              --push .github/docker/render-pdf
          else
            echo "$inspect_output" >&2
            exit 1
          fi

  proofs:
    needs: publish
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/render-pdf.yml
