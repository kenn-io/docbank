name: Restore Go caches
description: >-
  Restore the newest main-saved Go build and module caches for one job group.
  Pair with go-cache-save in the job that owns the group.
inputs:
  group:
    description: Cache group, such as linux-cgo or windows-amd64
    required: true
  extra-path:
    description: Additional cache directory owned by the group
    required: false
    default: ""
  save-owner:
    description: This job owns the group's daily main cache save
    default: "false"
runs:
  using: composite
  steps:
    - name: Set Windows cache paths
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        try {
          if (!(Test-Path 'D:\') -and $env:RUNNER_ARCH -eq 'ARM64') {
            Get-Disk | Where-Object {
              $_.Model -ceq 'Microsoft NVMe Direct Disk v2' -and $_.PartitionStyle -eq 'RAW'
            } | Initialize-Disk -PartitionStyle GPT -PassThru |
              New-Partition -DriveLetter D -UseMaximumSize |
              Format-Volume -FileSystem NTFS -Confirm:$false | Out-Null
          }
          $cacheEnv = foreach ($name in @('GOCACHE', 'GOMODCACHE')) {
            $path = Join-Path 'D:\a\_temp' $name
            New-Item -ItemType Directory -Force -Path $path | Out-Null
            "$name=$path"
          }
          $cacheEnv >> $env:GITHUB_ENV
        } catch {
          Write-Warning "Keeping current Go cache paths: $_"
        }

    - name: Select cache key and paths
      shell: bash
      env:
        GROUP: ${{ inputs.group }}
        EXTRA_PATH: ${{ inputs.extra-path }}
        GO_SUM: ${{ hashFiles('go.sum') }}
      run: |
        # One key per group and day: main refreshes it daily instead of freezing on go.sum.
        {
          echo "GO_CACHE_KEY=go-${GROUP}-${GO_SUM}-$(date -u +%Y-%m-%d)"
          echo "GO_CACHE_PREFIX=go-${GROUP}-${GO_SUM}-"
          echo "GO_CACHE_GROUP_PREFIX=go-${GROUP}-"
          echo "GO_CACHE_PATHS<<EOF"
          go env GOCACHE
          go env GOMODCACHE
          if [ -n "$EXTRA_PATH" ]; then echo "$EXTRA_PATH"; fi
          echo "EOF"
        } >> "$GITHUB_ENV"

    - name: Restore caches
      id: restore
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ env.GO_CACHE_PATHS }}
        key: ${{ env.GO_CACHE_KEY }}
        restore-keys: |
          ${{ env.GO_CACHE_PREFIX }}
          ${{ env.GO_CACHE_GROUP_PREFIX }}

    - name: Record exact cache hit
      shell: bash
      run: echo "GO_CACHE_HIT=${{ steps.restore.outputs.cache-hit }}" >> "$GITHUB_ENV"

    - name: Track cache use for the daily save
      if: >-
        inputs.save-owner == 'true'
        && github.event_name == 'push' && github.ref == 'refs/heads/main'
        && steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        EXTRA_PATH: ${{ inputs.extra-path }}
      run: |
        modcache=$(go env GOMODCACHE | tr '\\' '/')
        if [ -d "$modcache" ]; then
          # Replay restored downloads so only requested modules enter the next archive.
          mv "$modcache" "${modcache}.restored"
          # Tool builds outside go.sum, such as custom-gcl, verify against these records.
          mkdir -p "$modcache/cache/download"
          if [ -d "${modcache}.restored/cache/download/sumdb" ]; then
            cp -R "${modcache}.restored/cache/download/sumdb" "$modcache/cache/download/"
          fi
          proxy=$(node -e 'console.log(require("node:url").pathToFileURL(process.argv[1]).href)' "${modcache}.restored/cache/download")
          echo "GOPROXY=$proxy|$(go env GOPROXY)" >> "$GITHUB_ENV"
        fi
        paths=$(go env GOCACHE | tr '\\' '/')
        if [ -n "$EXTRA_PATH" ]; then paths+=$'\n'"${EXTRA_PATH/#\~/$HOME}"; fi
        {
          echo 'GO_CACHE_TRIM_PATHS<<EOF'
          echo "$paths"
          echo EOF
        } >> "$GITHUB_ENV"
        while IFS= read -r path; do
          if [ -d "$path" ]; then
            # Go refreshes cache mtimes at most hourly; force used entries to refresh.
            find "$path" -mindepth 2 -maxdepth 2 -name '*-a' -exec perl -e '$t=time-7200; utime $t,$t,@ARGV or die $!' {} +
          fi
        done <<< "$paths"
        touch "$RUNNER_TEMP/go-cache-use"

    - name: Rehydrate module sources
      shell: bash
      run: |
        # workflowretry: allow Rehydrate module sources from restored downloads.
        go mod download
