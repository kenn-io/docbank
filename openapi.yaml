  securitySchemes:
    apiKey:
      description: "The daemon's API key: configured `api_key`, or the ephemeral per-run key published in the runtime record."
      in: header
      name: X-Api-Key
      type: apiKey
    bearer:
      description: The same API key as a bearer token.
      scheme: bearer
      type: http
info:
  title: docbank
  version: dev
openapi: 3.1.0
paths:
  /api/daemon/challenge:
    get:
      operationId: challengeDaemon
      parameters:
        - in: query
          name: nonce
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  proof:
                    type: string
                required:
                  - proof
                type: object
          description: Daemon ownership proof
  /api/daemon/shutdown:
    post:
      operationId: shutdownDaemon
      parameters:
        - in: header
          name: X-Docbank-Daemon-Token
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Shutdown accepted
  /api/daemon/web-download:
    delete:
      operationId: cancelWebDownload
      parameters:
        - in: query
          name: ticket
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Download discarded
      summary: Discard a prepared browser download
    post:
      operationId: prepareWebDownload
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                blob_hash:
                  type: string
                node_id:
                  format: int64
                  type: integer
                purpose:
                  type: string
                revision:
                  format: int64
                  type: integer
                size:
                  format: int64
                  type: integer
                version_id:
                  type: string
              required:
                - node_id
                - revision
                - version_id
                - blob_hash
                - size
              type: object
        required: true
      responses:
        "200":
          content:
            application/x-ndjson:
              schema:
                additionalProperties: false
                properties:
                  blob_hash:
                    type: string
                  detail:
                    type: string
                  name:
                    type: string
                  phase:
                    type: string
                  received:
                    format: int64
                    type: integer
                  total:
                    format: int64
                    type: integer
                  url:
                    type: string
                  version_id:
                    type: string
                required:
                  - phase
                  - received
                  - total
                type: object
          description: Download progress and ticket
      summary: Verify a document and prepare a browser download
  /api/daemon/web-session:
    delete:
      operationId: revokeWebSession
      responses:
        "204":
          description: Session revoked
      summary: Revoke the current browser session
    post:
      operationId: createWebSession
      responses:
        "201":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  token:
                    type: string
                  upload_secret:
                    type: string
                  url:
                    type: string
                required:
                  - token
                  - upload_secret
                  - url
                type: object
          description: Browser session
      summary: Issue a scoped browser session
  /api/v1/audit/enable:
    post:
      description: Consumes a one-use preview token. The acknowledgment explicitly accepts permanent protected history plus names, topology, tags, assignments, ingests, and provenance across the vault, including outside the selected scope; preview again after any stale-token response.
      operationId: enableAudit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnableAuditRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Permanently enable the exact reviewed audit scope
  /api/v1/audit/history:
    get:
      description: Returns newest-first canonical events for one stable node. Use next_cursor to continue without shifting when newer events arrive.
      operationId: auditNodeHistory
      parameters:
        - explode: false
          in: query
          name: path
          schema:
            type: string
        - explode: false
          in: query
          name: node_id
          schema:
            format: int64
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: cursor
          schema:
            maxLength: 256
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Read one audited node's canonical event timeline
  /api/v1/audit/preview:
    post:
      operationId: previewAuditEnrollment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewAuditEnrollmentRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEnrollmentPreview"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Preview one permanent audit scope without changing the vault
  /api/v1/audit/scopes/{scope_id}/history:
    get:
      description: Returns newest-first canonical events across every member of one stable scope. Use next_cursor to continue without shifting when newer events arrive.
      operationId: auditScopeHistory
      parameters:
        - in: path
          name: scope_id
          required: true
          schema:
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: cursor
          schema:
            maxLength: 256
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditScopeEventPage"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Read canonical events across one permanent audit scope
  /api/v1/audit/status:
    get:
      operationId: auditStatus
      parameters:
        - explode: false
          in: query
          name: path
          schema:
            type: string
        - explode: false
          in: query
          name: node_id
          schema:
            format: int64
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Inspect audit authority and optional node protection
  /api/v1/audit/verify:
    post:
      description: Returns stable vault, allocation-lineage, and scope-chain evidence after independently replaying canonical history against current metadata and re-hashing every unique blob retained by protected history. Optional expected evidence is proved as an exact prefix of current authority.
      operationId: verifyAudit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditVerifyRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditVerifyReport"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Replay audit authority and verify every protected blob
  /api/v1/backup/init:
    post:
      operationId: initBackupRepository
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitBackupRepositoryRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupRepository"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Initialize an immutable backup repository
  /api/v1/backup/restore:
    post:
      operationId: restoreBackupSnapshot
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupRestoreRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupRestoreReport"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
