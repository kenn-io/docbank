  /api/v1/nodes/{id}/content:
    get:
      description: X-Docbank-Content-Version, X-Docbank-Blob-Hash, and X-Docbank-Blob-Size carry catalog identity before the body. Content-Digest is an RFC 9530 trailer computed from the bytes actually streamed; the standard Content-Length header is omitted so HTTP/1.1 can transmit that trailer without a second physical read.
      operationId: getNodeContent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: Document bytes with expected version and blob identity plus a computed digest trailer
          headers:
            Content-Digest:
              description: RFC 9530 SHA-256 of bytes actually streamed; delivered as an HTTP trailer
              schema:
                type: string
            X-Docbank-Blob-Hash:
              description: Catalog SHA-256 identity (lowercase hex)
              schema:
                pattern: ^[0-9a-f]{64}$
                type: string
            X-Docbank-Blob-Size:
              description: Catalog raw byte length
              schema:
                pattern: ^[0-9]+$
                type: string
            X-Docbank-Content-Version:
              description: Stable content-version UUID
              schema:
                format: uuid
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Stream a file's bytes
    put:
      description: Streams raw content under an If-Match node revision. The daemon grants metadata authority only after independently computing the declared SHA-256 and size.
      operationId: replaceNodeContent
      parameters:
        - description: Stable file node ID
          in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
        - description: Quoted or bare current node revision
          in: header
          name: If-Match
          required: true
          schema:
            type: string
        - description: Expected lowercase hexadecimal SHA-256 of the request body
          in: header
          name: X-Docbank-Blob-Hash
          required: true
          schema:
            pattern: ^[0-9a-f]{64}$
            type: string
        - description: Expected raw request-body byte length
          in: header
          name: X-Docbank-Blob-Size
          required: true
          schema:
            format: int64
            minimum: 0
            type: integer
      requestBody:
        content:
          "*/*":
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentReplacementReceipt"
          description: Replacement committed
          headers:
            ETag:
              description: Quoted resulting node revision
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Replace a file's content with a new immutable head
