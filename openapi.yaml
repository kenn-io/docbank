  /api/v1/uploads:
    post:
      description: Streams exactly one multipart field named `file`. X-Docbank-Blob-Hash and X-Docbank-Blob-Size are required declarations for the file payload, not the multipart envelope. Success grants node/blob authority only after both match.
      operationId: uploadFile
      parameters:
        - description: Stable destination directory node ID
          in: query
          name: parent_id
          required: true
          schema:
            format: int64
            type: integer
        - description: Virtual filename; must equal the multipart filename
          in: query
          name: name
          required: true
          schema:
            minLength: 1
            type: string
        - description: Expected lowercase hexadecimal SHA-256 of the file payload
          in: header
          name: X-Docbank-Blob-Hash
          required: true
          schema:
            pattern: ^[0-9a-f]{64}$
            type: string
        - description: Expected raw file byte length
          in: header
          name: X-Docbank-Blob-Size
          required: true
          schema:
            format: int64
            minimum: 0
            type: integer
      requestBody:
        content:
          multipart/form-data:
            encoding:
              file:
                contentType: "*/*"
            schema:
              properties:
                file:
                  contentMediaType: application/octet-stream
                  format: binary
                  type: string
              required:
                - file
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadReceipt"
          description: Idempotent retry converged on the existing node
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadReceipt"
          description: New file node created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Upload one digest-checked file
  /api/v1/verify:
    post:
      operationId: verify
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyReport"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Validate metadata and re-hash every stored blob
  /api/v1/versions/{version_id}:
    get:
      operationId: getContentVersion
      parameters:
        - in: path
          name: version_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentVersion"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Inspect one immutable content version by stable ID
  /api/v1/versions/{version_id}/content:
    get:
      description: Version, blob hash, and size headers identify expected authority before the body. Content-Digest is an RFC 9530 trailer computed from the bytes actually streamed.
      operationId: getContentVersionBytes
      parameters:
        - in: path
          name: version_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: Document bytes with expected version and blob identity plus a computed digest trailer
          headers:
            Content-Digest:
              description: RFC 9530 SHA-256 of bytes actually streamed; delivered as an HTTP trailer
              schema:
                type: string
            X-Docbank-Blob-Hash:
              description: Catalog SHA-256 identity (lowercase hex)
              schema:
                pattern: ^[0-9a-f]{64}$
                type: string
            X-Docbank-Blob-Size:
              description: Catalog raw byte length
              schema:
                pattern: ^[0-9]+$
                type: string
            X-Docbank-Content-Version:
              description: Stable content-version UUID
              schema:
                format: uuid
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Stream one immutable content version by stable ID
  /api/v1/versions/{version_id}/email:
    get:
      operationId: getEmailMetadata
      parameters:
        - in: path
          name: version_id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailMetadata"
          description: Selected email metadata
          headers:
            Cache-Control:
              description: Mutable selection state is not cacheable
              schema:
                type: string
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailPending"
          description: Eligible email metadata is pending
          headers:
            Cache-Control:
              description: Mutable selection state is not cacheable
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Read selected email metadata for one immutable version
    post:
      operationId: ensureEmailMetadata
      parameters:
        - in: path
          name: version_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailMetadata"
          description: Email metadata
          headers:
            Cache-Control:
              description: Mutable selection state is not cacheable
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Ensure email metadata for one immutable version
  /api/v1/versions/{version_id}/email/generations/{generation_id}:
    get:
      operationId: getEmailMetadataGeneration
      parameters:
        - in: path
          name: version_id
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: generation_id
          required: true
          schema:
            pattern: ^[0-9a-f]{64}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailMetadata"
          description: Attached email generation
          headers:
            Cache-Control:
              description: Mutable selection state is not cacheable
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Read an immutable email generation attached to one version
  /api/v1/versions/{version_id}/email/generations/{generation_id}/parts/{part_path}/{role}:
    get:
      operationId: getEmailPart
      parameters:
        - in: path
          name: version_id
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: generation_id
          required: true
          schema:
            pattern: ^[0-9a-f]{64}$
            type: string
        - in: path
          name: part_path
          required: true
          schema:
            type: string
        - in: path
          name: role
          required: true
          schema:
            enum:
              - raw_headers
              - decoded_payload
              - body_utf8
            type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: Verified bytes for one exact email part artifact
          headers:
            Content-Digest:
              description: RFC 9530 SHA-256 of bytes actually streamed; delivered as an HTTP trailer
              schema:
                type: string
            X-Docbank-Blob-Hash:
              description: Catalog SHA-256 identity (lowercase hex)
              schema:
                pattern: ^[0-9a-f]{64}$
                type: string
            X-Docbank-Blob-Size:
              description: Catalog raw byte length
              schema:
                pattern: ^[0-9]+$
                type: string
            X-Docbank-Content-Version:
              description: Stable content-version UUID
              schema:
                format: uuid
                type: string
            X-Docbank-Email-Attachment:
              description: Version-to-generation attachment SHA-256
              schema:
                pattern: ^[0-9a-f]{64}$
                type: string
            X-Docbank-Email-Generation:
              description: Immutable email generation SHA-256
              schema:
                pattern: ^[0-9a-f]{64}$
                type: string
            X-Docbank-Email-Part-Path:
              description: Canonical dotted MIME part path
              schema:
                type: string
            X-Docbank-Email-Part-Role:
              description: Typed MIME artifact role
              schema:
                enum:
                  - raw_headers
                  - decoded_payload
                  - body_utf8
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Stream one verified immutable email part artifact
