          name: under_node_id
          schema:
            format: int64
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: modified_since
          schema:
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: modified_before
          schema:
            maxLength: 64
            type: string
      responses:
