      operationId: appendNodeProvenance
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            minimum: 1
            type: integer
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvenanceAppendRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvenanceAppendReceipt"
          description: Created
          headers:
            ETag:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Append an immutable origin fact to a file node
