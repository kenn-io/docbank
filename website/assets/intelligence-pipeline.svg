<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 400" role="img" aria-labelledby="title desc">
  <title id="title">Docbank intelligence pipeline</title>
  <desc id="desc">One exact source version feeds governed rendition, chunk, embedding, and index derivatives that can be purged and rebuilt without touching the record.</desc>
  <defs>
    <pattern id="pipeline-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#12312a"/>
    </pattern>
  </defs>
  <rect width="1240" height="400" fill="#071411"/>
  <rect width="1240" height="400" fill="url(#pipeline-grid)"/>
  <path d="M258 48V352" fill="none" stroke="#2e574c" stroke-width="2" stroke-dasharray="4 6"/>
  <g fill="none" stroke="#41d7bd" stroke-width="2">
    <path d="M220 200h72"/>
    <path d="M480 200h52"/>
    <path d="M720 200h52"/>
    <path d="M960 200h52"/>
  </g>
  <g fill="#41d7bd">
    <path d="M292 195l10 5-10 5z"/>
    <path d="M532 195l10 5-10 5z"/>
    <path d="M772 195l10 5-10 5z"/>
    <path d="M1012 195l10 5-10 5z"/>
    <circle cx="258" cy="200" r="4.5" stroke="#071411" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#2e574c" stroke-width="2">
    <path d="M1110 240v58q0 12-12 12H402q-12 0-12-12v-46"/>
  </g>
  <path d="M385 256h10l-5-10z" fill="#2e574c"/>
  <rect x="40" y="160" width="180" height="80" rx="8" fill="#102822" stroke="#2e574c" stroke-width="1.5"/>
  <g fill="none" stroke="#41d7bd" stroke-width="2.5" stroke-linecap="round">
    <path d="M40 178v-10q0-8 8-8h10"/>
    <path d="M202 160h10q8 0 8 8v10"/>
    <path d="M40 222v10q0 8 8 8h10"/>
    <path d="M202 240h10q8 0 8-8v-10"/>
  </g>
  <g fill="#0c1e1a" stroke="#25473f" stroke-width="1.5">
    <rect x="300" y="160" width="180" height="80" rx="6"/>
    <rect x="540" y="160" width="180" height="80" rx="6"/>
    <rect x="780" y="160" width="180" height="80" rx="6"/>
    <rect x="1020" y="160" width="180" height="80" rx="6"/>
  </g>
  <g font-family="JetBrains Mono, ui-monospace, monospace" text-anchor="middle">
    <text x="130" y="104" fill="#41d7bd" font-size="12" letter-spacing="3">THE RECORD</text>
    <text x="750" y="104" fill="#41d7bd" font-size="12" letter-spacing="3">GOVERNED DERIVATIVES</text>
    <text transform="rotate(-90 244 200)" x="244" y="200" fill="#a7c1ba" font-size="10" letter-spacing="2">CONSENT</text>
    <g fill="#edf8f4" font-size="16" letter-spacing="2">
      <text x="130" y="196">SOURCE</text>
      <text x="390" y="196">RENDITION</text>
      <text x="630" y="196">CHUNKS</text>
      <text x="870" y="196">EMBEDDINGS</text>
      <text x="1110" y="196">INDEX</text>
    </g>
    <g fill="#a7c1ba" font-size="11" letter-spacing="1">
      <text x="130" y="220">exact bytes · v3</text>
      <text x="390" y="220">ocr · markdown</text>
      <text x="630" y="220">deterministic</text>
      <text x="870" y="220">generation-bound</text>
      <text x="1110" y="220">rebuildable</text>
    </g>
    <text x="750" y="342" fill="#a7c1ba" font-size="12" letter-spacing="1">purge · re-derive · swap providers · rebuild — the record never moves</text>
  </g>
