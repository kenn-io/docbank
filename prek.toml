minimum_prek_version = "0.3.6"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "go-fmt-lint"
name = "go-fmt-lint"
language = "system"
entry = "make fmt lint"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "forbid-superpowers-artifacts"
name = "forbid-superpowers-artifacts"
language = "fail"
entry = "Keep specs, plans, and reviews local; distill them into living documentation before opening a PR. Inspect make docs-screenshots output and publish the complete capture set to docs-assets."
files = "^(\\.superpowers/|docs/superpowers/)"

[[repos.hooks]]
id = "huma-check"
name = "huma-check"
language = "system"
entry = "go run go.kenn.io/kit/cmd/huma-check@3e1f59e9011e878ec595aa04aebc8a77c5292c4d -fix=false -tags fts5 ./..."
pass_filenames = false
always_run = true
